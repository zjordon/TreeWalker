[project]
name = "treewalker"
version = "0.17.0"
description = "A simplified browser automation agent based on browser-use architecture"
requires-python = ">=3.12"
dependencies = [
    "cdp-use>=1.4.5",
    # issue #187：1.x 线的 Messages.create 移除 temperature/top_p（采样参数断裂，
    # 且 GLM 兼容端点为 0.x Messages 形状）——上界防止下游环境重新解析落 1.x
    #（eval 仓 66 评测静默计 0 事故即源于无上界解析到 1.4.0）。
    "anthropic>=0.109.0,<1.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.0.0",
    "textual>=3.0.0",
    "click>=8.0.0",
    "markdownify>=0.13.1",
    "aiohttp>=3.9.0",
    "dom-snapshot>=0.1.1",  # ROADMAP P1：DOM 快照公共库（本地 editable 见 [tool.uv.sources]；>=0.1.1 单字符文本修复 dom-snapshot#1）
]

[project.optional-dependencies]
vision = ["pillow>=10.0.0"]
docs = ["pypdf>=4.0.0", "python-docx>=1.1.0"]

[project.scripts]
tw-tui = "tree_walker.cli:main"
tw-web = "tree_walker.cli:web"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tree_walker"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
# 本地 editable 开发：dom-snapshot 源码在 ../dom-snapshot（与 TreeWalker 同级）。
# 远端/CI 可改成 { git = "https://github.com/zjordon/dom-snapshot.git", tag = "v0.1.1" }。
dom-snapshot = { path = "../dom-snapshot", editable = true }
