[project]
name = "treewalker"
version = "0.17.0"
description = "A simplified browser automation agent based on browser-use architecture"
requires-python = ">=3.12"
dependencies = [
    "cdp-use>=1.4.5",
    "anthropic>=0.104.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.0.0",
    "textual>=3.0.0",
    "click>=8.0.0",
    "markdownify>=0.13.1",
    "aiohttp>=3.9.0",
    "dom-snapshot>=0.1.0",  # ROADMAP P1：DOM 快照公共库（本地 editable 见 [tool.uv.sources]）
]

[project.optional-dependencies]
vision = ["pillow>=10.0.0"]
docs = ["pypdf>=4.0.0", "python-docx>=1.1.0"]

[project.scripts]
tw-tui = "tree_walker.cli:main"
tw-web = "tree_walker.cli:web"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tree_walker"]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
]

[tool.uv.sources]
# 本地 editable 开发：dom-snapshot 源码在 ../dom-snapshot（与 TreeWalker 同级）。
# 远端/CI 可改成 { git = "https://github.com/zjordon/dom-snapshot.git", tag = "v0.1.0" }。
dom-snapshot = { path = "../dom-snapshot", editable = true }
